<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>商品一覧</title>
</head>

<body>
	<!--見出し-->
	<h1>商品一覧</h1>
	<!--検索フォーム-->
	<!--	<form>-->
	<!--		<input type="number" name="categoryId" placeholder="カテゴリーID"/>-->

	<!--		<button>検索</button>-->
	<!--	</form>-->

	<!--カテゴリー検索-->
	<a href="/">全商品</a>
	<th:block th:each="category : ${categoryList}">
		<a th:href="|/?categoryId=${category.id}|" th:text="${category.name}"></a>
	</th:block>



	<!--表-->
	<table border="1">
		<!--ヘッダー行-->
		<tr>
			<th>商品ID</th>
			<th>商品名</th>
			<th>価格</th>
		</tr>
		<tr th:each="item : ${itemList}">
			<td th:text="${item.id}"></td>
			<td th:text="${item.name}"></td>
			<td th:text="${item.price}"></td>

		</tr>
	</table>

</body>

</html>
