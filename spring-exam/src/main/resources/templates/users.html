<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>顧客一覧</title>
</head>

<body>
	<h1>顧客一覧</h1>

	<table border="1">

		<tr>
			<th>顧客ID</th>
			<th>名前</th>
			<th>メールアドレス</th>
			<th>パスワード</th>

		</tr>
		<tr th:each="user:${userList}">
			<td th:text="${user.name}"></td>
			<td th:text="${user.email}"></td>
			<td th:text="${user.password}"></td>

			<td>
				<form th:action="|/edit/${user.id}|" method="get">
					<button>更新</button>
				</form>
			</td>

			<td>
				<form th:action="|/users/${user.id}/delete|" method="post">
					<button>削除</button>
				</form>
			</td>


		</tr>

	</table>

	<a href="/users/add">新規作成</a>

</body>

</html>
