<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>商品登録</title>
</head>
<body>
	<h1>商品登録</h1>
	<ul th:if="${errList}">
		<li th:each="error : ${errList}" th:text="${error}" ></li>
		
	</ul>
	
	<form method="post" action="/complete">
		商品名：
		<input type="text" name="name"th:value="${item.name}">
		<br/>
		価格：
		<input type="number" name="price"th:value="${item.price}">
		<br/>
		<button>登録</button>
	</form>

</body>
</html>
