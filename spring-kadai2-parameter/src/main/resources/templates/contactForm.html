<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>お問い合わせ</title>
</head>
<body>
	
	<h1>研修お問い合わせ</h1>
	<form method="post" action="/contact">
	
	<table border="1">
		<tr>
			<th>お名前[必須]</th>
			<td>
				<input type="text" name="name">
			</td>
		</tr>
		<tr>
			<th>メールアドレス[必須]</th>
			<td>
				<input type="email" name="email">
			</td>
		</tr>
	</table>
	
	<br/>
	
	<button>送信</button>
	
	</form>

</body>
</html>
