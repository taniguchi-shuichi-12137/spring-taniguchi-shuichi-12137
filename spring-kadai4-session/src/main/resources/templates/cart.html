<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>ショッピングカート</title>
</head>

<body>

	<h1>ショッピングカート</h1>
		<form action="/cart" method="post">
			
			<input type="text" name="name" placeholder="商品名">
			<input type="text" name="price" placeholder="価格">
			
			<button>カートに追加</button>
		</form>



		<table border="1">
	
			<tr>
	
				<th>商品名</th>
				<th>価格</th>
	
			</tr>
			<tr>
				<td th:text="${name}"></td>
				<td th:text="${price}"></td>
			</tr>
	
		</table>

</body>

</html>
